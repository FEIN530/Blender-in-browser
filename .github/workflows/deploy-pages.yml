name: Fast Deploy Prebuilt Blender-WASM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build demo frontend
        run: |
          cd demo && npm install && npm run build

      - name: Download precompiled Blender WASM engine
        run: |
          mkdir -p demo/dist/blender
          curl -sL https://github.com/HeyPuter/blender-wasm/releases/download/1.0.0/blender6.tar.gz -o /tmp/blender.tar.gz
          tar -xzf /tmp/blender.tar.gz -C demo/dist/blender

      - name: Inject coi-serviceworker and on-screen error log
        run: |
          curl -sL https://unpkg.com/coi-serviceworker@0.1.7/coi-serviceworker.min.js -o demo/dist/coi-serviceworker.js
          python3 -c '
          overlay = """<script src="coi-serviceworker.js"></script>
          <script>
            window.addEventListener("DOMContentLoaded", () => {
              const box = document.createElement("pre");
              box.style.cssText = "position:fixed;bottom:10px;left:10px;right:10px;max-height:35vh;overflow:auto;background:#111;color:#0f0;padding:10px;font-size:12px;z-index:99999;border-radius:6px;";
              const log = (m) => { box.textContent += m + "\\n"; };
              document.body.appendChild(box);
              log("crossOriginIsolated: " + window.crossOriginIsolated);
              log("WebGPU (navigator.gpu): " + !!navigator.gpu);
              window.addEventListener("error", (e) => log("ERROR: " + (e.message || e.target?.src || e.target?.href)), true);
              window.addEventListener("unhandledrejection", (e) => log("PROMISE ERROR: " + e.reason));
              const origFetch = window.fetch;
              window.fetch = async (...args) => {
                const res = await origFetch(...args);
                if (!res.ok) log("FETCH " + res.status + ": " + res.url);
                return res;
              };
            });
          </script>"""
          html = open("demo/dist/index.html").read()
          open("demo/dist/index.html", "w").write(html.replace("<head>", "<head>\n" + overlay, 1))
          '

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
