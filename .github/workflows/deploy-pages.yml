name: Deploy Level-2 Optimized Blender-WASM

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Build demo frontend with relative paths
        run: |
          cd demo && npm install && npm run build -- --base=./

      - name: Download precompiled Blender WASM files
        run: |
          curl -fL "https://github.com/HeyPuter/blender-wasm/releases/download/1.0.0/blender8-1.tar.gz" -o /tmp/blender_release.tar.gz || \
          curl -fL "https://github.com/HeyPuter/blender-wasm/releases/download/1.0.0/blender6.tar.gz" -o /tmp/blender_release.tar.gz
          mkdir -p /tmp/extracted
          tar -xzf /tmp/blender_release.tar.gz -C /tmp/extracted
          find /tmp/extracted -type f -exec cp {} demo/dist/ \;

      - name: Strip heavy assets and bake low-RAM Blender startup preferences
        run: |
          python3 - << 'EOF'
          import glob, os, shutil, subprocess

          if os.path.exists("demo/dist/assets.tar.zst"):
              os.makedirs("/tmp/assets_dir", exist_ok=True)
              subprocess.run(["zstd", "-d", "demo/dist/assets.tar.zst", "-o", "/tmp/assets.tar"], check=True)
              subprocess.run(["tar", "-xf", "/tmp/assets.tar", "-C", "/tmp/assets_dir"], check=True)

              # 1. Remove heavy optional datafiles (HDRI studio lights & sculpt brushes)
              for root, dirs, _ in os.walk("/tmp/assets_dir"):
                  for d in list(dirs):
                      if d in ("studiolights", "brush_assets"):
                          target = os.path.join(root, d)
                          print("Stripping:", target)
                          shutil.rmtree(target)
                          dirs.remove(d)

              # 2. Inject automatic low-RAM startup script into Blender's scripts/startup/
              startup_code = """import bpy
          from bpy.app.handlers import persistent

          def apply_low_ram_prefs():
              prefs = bpy.context.preferences
              prefs.edit.undo_steps = 10
              prefs.edit.undo_memory_limit = 256
              prefs.view.show_splash = False
              prefs.filepaths.save_version = 0
              for attr, val in [("gl_texture_limit", "LIMIT_1024"), ("viewport_aa", "OFF")]:
                  if hasattr(prefs.system, attr):
                      try:
                          setattr(prefs.system, attr, val)
                      except Exception:
                          pass

          @persistent
          def optimize_scene(_dummy=None):
              apply_low_ram_prefs()
              for scene in bpy.data.scenes:
                  if hasattr(scene, "eevee"):
                      for attr, val in [("taa_samples", 4), ("use_raytracing", False), ("shadow_pool_size", "64")]:
                          if hasattr(scene.eevee, attr):
                              try:
                                  setattr(scene.eevee, attr, val)
                              except Exception:
                                  pass
              for window in bpy.context.window_manager.windows:
                  for area in window.screen.areas:
                      if area.type == "VIEW_3D":
                          for space in area.spaces:
                              if space.type == "VIEW_3D":
                                  space.shading.type = "SOLID"
                                  space.shading.show_cavity = False
                                  space.shading.show_shadows = False

          def register():
              apply_low_ram_prefs()
              if optimize_scene not in bpy.app.handlers.load_post:
                  bpy.app.handlers.load_post.append(optimize_scene)
              bpy.app.timers.register(optimize_scene, first_interval=0.2)
          """

              for sdir in glob.glob("/tmp/assets_dir/**/scripts/startup", recursive=True):
                  script_path = os.path.join(sdir, "chromebook_low_ram.py")
                  with open(script_path, "w") as f:
                      f.write(startup_code)
                  print("Injected low-RAM startup script:", script_path)

              # 3. Repack assets.tar.zst at maximum compression
              os.remove("/tmp/assets.tar")
              os.remove("demo/dist/assets.tar.zst")
              subprocess.run(["tar", "-cf", "/tmp/assets.tar", "-C", "/tmp/assets_dir", "."], check=True)
              subprocess.run(["zstd", "-19", "/tmp/assets.tar", "-o", "demo/dist/assets.tar.zst"], check=True)
          EOF

      - name: Inject coi-serviceworker, hardware caps, and .blend save fix
        run: |
          curl -fL https://unpkg.com/coi-serviceworker@0.1.7/coi-serviceworker.min.js -o demo/dist/coi-serviceworker.js
          python3 - << 'EOF'
          head_inject = """<script src="./coi-serviceworker.js"></script>
          <script>
            try {
              Object.defineProperty(navigator, "hardwareConcurrency", { get: () => 2 });
              Object.defineProperty(window, "devicePixelRatio", { get: () => 1 });
            } catch (e) {}

            // Strip trailing '@' when Blender's safe-save triggers a .blend@ download
            const fixBlendName = (v) => (typeof v === "string" && v.endsWith(".blend@")) ? v.slice(0, -1) : v;
            const dlDesc = Object.getOwnPropertyDescriptor(HTMLAnchorElement.prototype, "download");
            if (dlDesc && dlDesc.set) {
              Object.defineProperty(HTMLAnchorElement.prototype, "download", {
                set(v) { return dlDesc.set.call(this, fixBlendName(v)); },
                get() { return dlDesc.get.call(this); }
              });
            }
            const origSetAttr = Element.prototype.setAttribute;
            Element.prototype.setAttribute = function(name, v) {
              if (this.tagName === "A" && name.toLowerCase() === "download") v = fixBlendName(v);
              return origSetAttr.call(this, name, v);
            };
            if (window.showSaveFilePicker) {
              const origPicker = window.showSaveFilePicker;
              window.showSaveFilePicker = function(opts = {}) {
                if (opts && opts.suggestedName) opts = { ...opts, suggestedName: fixBlendName(opts.suggestedName) };
                return origPicker.call(this, opts);
              };
            }
          </script>
          """
