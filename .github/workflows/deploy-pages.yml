name: Deploy Blender-WASM to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build demo frontend with relative paths
        run: |
          cd demo && npm install && npm run build -- --base=./

      - name: Download and place precompiled Blender WASM files
        run: |
          curl -fL "https://github.com/HeyPuter/blender-wasm/releases/download/1.0.0/blender8-1.tar.gz" -o /tmp/blender_release.tar.gz || \
          curl -fL "https://github.com/HeyPuter/blender-wasm/releases/download/1.0.0/blender6.tar.gz" -o /tmp/blender_release.tar.gz
          mkdir -p /tmp/extracted demo/dist/blender
          tar -xzf /tmp/blender_release.tar.gz -C /tmp/extracted
          find /tmp/extracted -type f -exec sh -c '
            for f do
              name=$(basename "$f")
              cp "$f" "demo/dist/$name"
              cp "$f" "demo/dist/blender/$name"
              echo "Placed: $name"
            done
          ' sh {} +

      - name: Inject coi-serviceworker and on-screen status log
        run: |
          curl -fL https://unpkg.com/coi-serviceworker@0.1.7/coi-serviceworker.min.js -o demo/dist/coi-serviceworker.js
          python3 - << 'EOF'
          coi = '<script src="./coi-serviceworker.js"></script>\n'
          overlay = """
          <pre id="wasm-debug" style="position:fixed;bottom:10px;left:10px;right:10px;max-height:30vh;overflow:auto;background:#111;color:#0f0;padding:10px;font-size:12px;z-index:99999;border-radius:6px;margin:0;"></pre>
          <script>
            (function() {
              const box = document.getElementById("wasm-debug");
              const log = (m) => { box.textContent += m + "\\n"; };
              log("crossOriginIsolated: " + window.crossOriginIsolated);
              log("WebGPU (navigator.gpu): " + !!navigator.gpu);
              window.addEventListener("error", (e) => log("ERROR: " + (e.message || e.target?.src || e.target?.href)), true);
              window.addEventListener("unhandledrejection", (e) => log("PROMISE: " + e.reason));
              const origFetch = window.fetch;
              window.fetch = async (...args) => {
                const res = await origFetch(...args);
                if (!res.ok) log("FETCH " + res.status + ": " + res.url);
                return res;
              };
            })();
          </script>
          """
          html = open("demo/dist/index.html").read()
          html = html.replace("<head>", "<head>\n" + coi, 1)
          html = html.replace("</body>", overlay + "\n</body>", 1)
          open("demo/dist/index.html", "w").write(html)
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
